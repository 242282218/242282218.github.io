# 写作软件（apps/writer）的 Rust 构建产物不放进仓库目录：
# 单次构建可达数 GB，放在博客目录里会拖慢备份、杀毒扫描与全盘搜索。
#
# target-dir 的相对路径以本文件所在目录（仓库根）为基准解析，
# 因此 ../.build/writer-target 落在仓库的上一级。
# Cargo 按「当前工作目录」向上查找配置，把本文件放在仓库根可同时覆盖
# `cargo test --manifest-path apps/writer/src-tauri/Cargo.toml`（根目录执行）
# 与 `pnpm --dir apps/writer tauri build`（apps/writer 执行）两种调用方式。
[build]
target-dir = "../.build/writer-target"
