[package]
name = "guanlanzhi-writer"
version = "0.1.0"
description = "观澜志本地写作软件"
authors = ["guanlangzg"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "guanlanzhi_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
dirs = "7"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
